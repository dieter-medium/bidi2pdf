name: Chromedriver CI
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      dockerImageTag:
        description: 'Docker image tag'
        required: false
        type: string
  
  push:
    branches: [ main, master ]
    tags:
      - 'v**'

jobs:
  push_chromedriver_to_registry:
    name: Push Docker Chromedriver image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: dieters877565/chromedriver
          tags: |
            type=raw,value=${{ inputs.dockerImageTag }},enable=${{ inputs.dockerImageTag != '' }}
            type=ref,event=branch,suffix=${{matrix.variant.suffix}}
            type=semver,pattern={{version}}${{matrix.variant.suffix}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.chromedriver
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/dieters877565/chromedriver
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true