name: Ruby CI
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      dockerImageTag:
        description: 'Docker image tag'
        required: false
        type: string
  
  push:
    branches: [ main, master ]
    tags:
      - 'v**'
  pull_request:
    branches: [ main, master ]

env:
  SHOW_CONTAINER_LOGS: true
  DISABLE_CHROME_SANDBOX: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Ruby Environment
        uses: ./.github/actions/setup-ruby
      - name: Lint with RuboCop
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec rubocop
      - name: Verify RBS signatures are up to date
        run: |
          bundle exec rake rbs:clean_rbs rbs:generate_rbs
          # git diff alone misses a new lib/ file whose regenerated sig/ counterpart is untracked
          # (exactly the failure mode this check exists to catch) - status --porcelain covers
          # modified, deleted, and untracked alike.
          if [ -n "$(git status --porcelain sig/)" ]; then
            echo "sig/ is out of date - run 'bundle exec rake rbs:clean_rbs rbs:generate_rbs' and commit the result"
            git status --porcelain sig/
            git diff sig/
            exit 1
          fi
      - name: Validate RBS syntax
        run: bundle exec rbs validate

  gem-build:
    needs:
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Ruby Environment
        uses: ./.github/actions/setup-ruby
      - name: Build gem
        run: |
          bundle exec rake build
      - name: Upload gem
        uses: actions/upload-artifact@v6
        with:
          name: bidi2pdf-gem
          path: pkg/

  unit-test:
    needs: lint
    uses: ./.github/workflows/run-rspec-tests.yml
    with:
      test_tag: unit
      artifact_name: unit-coverage

  integration-test:
    needs: lint
    uses: ./.github/workflows/run-rspec-tests.yml
    with:
      test_tag: integration
      artifact_name: integration-coverage

  acceptance-test:
    needs: lint
    uses: ./.github/workflows/run-rspec-tests.yml
    with:
      test_tag: acceptance
      artifact_name: acceptance-coverage
      upload_pdf: true

  push_cli_to_registry:
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - unit-test
      - integration-test
      - acceptance-test
      - gem-build
    name: Push bidi2pdf cli Docker image to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: default
            file: ./docker/Dockerfile
            suffix: ""
          - name: slim
            file: ./docker/Dockerfile.slim
            suffix: "-slim"
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Download gem package
        uses: actions/download-artifact@v7
        with:
          name: bidi2pdf-gem
          path: pkg

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: dieters877565/bidi2pdf
          tags: |
            type=raw,value=${{ inputs.dockerImageTag }},enable=${{ inputs.dockerImageTag != '' }}
            type=ref,event=branch,suffix=${{matrix.variant.suffix}}
            type=semver,pattern={{version}}${{matrix.variant.suffix}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/dieters877565/bidi2pdf
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

